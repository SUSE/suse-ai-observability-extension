version: '3'

dotenv: ['./.env']

vars:
  IMAGE: '{{.IMAGE_NAME | default "suse-ai-observability"}}'
  VERSION: '{{.IMAGE_VERSION | default "latest"}}'
  RUNTIME: '{{.CONTAINER_RUNTIME | default "podman"}}'

tasks:
  build:
    desc: Build the setup container image
    cmds:
      - '{{.RUNTIME}} build -f Dockerfile -t {{.IMAGE}}:{{.VERSION}} .'

  push:
    desc: Push the setup container image
    cmds:
      - '{{.RUNTIME}} push {{.IMAGE}}:{{.VERSION}}'

  version-up:
    desc: Increment the StackPack patch, or set a higher TARGET_VERSION
    env:
      TARGET_VERSION: '{{.TARGET_VERSION | default ""}}'
    cmds:
      - python3 scripts/bump-version.py

  stackpack-test:
    desc: Run Collector, query, template and Groovy regressions (see knowledge/REGRESSION_TESTS.md)
    cmds:
      - npx --yes --package npm-groovy-lint@18.0.0 -c 'python3 -B -m unittest discover -s tests -v'

  stackpack-sync-status:
    desc: Read the installed SUSE AI synchronization status and error details
    cmds:
      - |
        sync_status=0
        sts topology-sync list || sync_status=$?
        for sync_name in suse-ai suse-ai-products suse-ai-topology; do
          sts topology-sync describe --identifier "urn:stackpack:suse-ai:shared:sync:$sync_name" || sync_status=$?
        done
        exit "$sync_status"

  stackpack-upload:
    desc: Zips, uploads and upgrades the stackpack
    deps: [stackpack-validate]
    cmds:
      - |
        STACKPACK_VERSION=$(grep 'version =' stackpack/suse-ai/stackpack.conf | cut -d'"' -f2)
        ARCHIVE="/tmp/suse-ai-${STACKPACK_VERSION}.sts"
        rm -f "$ARCHIVE"
        cd stackpack/suse-ai
        zip -r "$ARCHIVE" stackpack.conf provisioning resources
        sts stackpack upload --file "$ARCHIVE"
        sts stackpack upgrade --name suse-ai --unlocked-strategy overwrite

  stackpack-validate:
    desc: Validates StackPack IDs and Groovy synchronization scripts
    cmds:
      - python3 scripts/check-id-conflicts.py
      - npx --yes npm-groovy-lint@18.0.0 'stackpack/suse-ai/provisioning/templates/**/*.groovy' --failon error
      - npx --yes npm-groovy-lint@18.0.0 --path tests --files '*.groovy' --failon error

  stackpack-uninstall:
    desc: Uninstall all installed instances of SUSE AI Observability stackpack
    cmds:
      - |
        sts stackpack list-instances --name suse-ai -o json | jq -r '.instances[] | select(.status == "INSTALLED" or .status == "ERROR") | .id' | while read ID; do
          echo "Uninstalling instance $ID"
          sts stackpack uninstall --id "$ID" --name suse-ai
        done

  sts-script:
    desc: Runs a Groovy script from a file (use FILE=path/to/script.groovy)
    cmds:
      - sts script run --file "{{.FILE}}"
