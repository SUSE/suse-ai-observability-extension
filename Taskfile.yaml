version: '3'

dotenv: ['./.env']

includes:
  dashboards: Taskfile.dashboards-icons.yaml

vars:
  RUNTIME: '{{.CONTAINER_RUNTIME | default "podman"}}'
  PYTHON: '{{.PYTHON | default "python3"}}'
  STS_CONTEXT: '{{.STS_CONTEXT | default ""}}'
  OLLAMA_VERSION: '{{.OLLAMA_VERSION | default "3.0.0"}}'
  OLLAMA_IMAGE: '{{.OLLAMA_IMAGE | default (printf "registry.suse.com/ai/containers/suse/suse-ai-ollama-exporter:%s" .OLLAMA_VERSION)}}'
  OLLAMA_PLATFORM: '{{.OLLAMA_PLATFORM | default "linux/amd64"}}'
  OLLAMA_REVISION:
    sh: |
      revision=$(git rev-parse HEAD)
      if [ -n "$(git status --porcelain -- integrations/ollama)" ]; then
        revision="$revision-dirty"
      fi
      printf '%s' "$revision"

tasks:
  version-up:
    desc: Increment the StackPack patch, or set a higher TARGET_VERSION
    env:
      TARGET_VERSION: '{{.TARGET_VERSION | default ""}}'
    cmds:
      - python3 scripts/bump-version.py

  stackpack-test:
    desc: Run native mapping, query, Collector and release tests (Docker/Podman required)
    env:
      AI_CONTAINER_RUNTIME: '{{.RUNTIME}}'
      STS_CONTEXT: '{{.STS_CONTEXT}}'
    cmds:
      - bash -c 'source scripts/ci/stackpack-images.env; exec "{{.PYTHON}}" -B -m unittest discover -s tests/suse-ai -v'
      - task: stackpack-release-test

  stackpack-release-test:
    desc: Test deterministic packaging, version updates and installer state transitions
    cmds:
      - '{{.PYTHON}} -B -m unittest discover -s tests -p "test_*.py" -v'

  stackpack-presentation-test:
    desc: Test table contracts and optional read-only live presentation checks
    cmds:
      - '{{.PYTHON}} -B -m unittest discover -s tests/suse-ai -p test_presentation_tables.py -v'

  stackpack-review-package:
    desc: Package a temporary review version without changing the release manifest (REVIEW_VERSION required)
    requires:
      vars: [REVIEW_VERSION]
    env:
      REVIEW_VERSION: '{{.REVIEW_VERSION}}'
      REVIEW_OUTPUT: '{{.REVIEW_OUTPUT | default "dist/review"}}'
    cmds:
      - '{{.PYTHON}} -B scripts/package-review.py'

  stackpack-package:
    aliases: [stackpack-build]
    desc: Build dist/suse-ai-<version>.sts and SHA256SUMS reproducibly, without sts or network
    cmds:
      - bash scripts/package-stackpack.sh

  stackpack-test-legacy-collector:
    desc: Test the retained 2.x Collector examples (requires COLLECTOR_BIN)
    cmds:
      - '{{.PYTHON}} -B -m unittest discover -s tests/legacy -p test_collector.py -v'

  open-webui-test:
    desc: Test the in-process Open WebUI integration (install integrations/open-webui/tests/requirements.txt first)
    cmds:
      - python3 -B -m unittest discover -s integrations/open-webui/tests -v

  ollama-test:
    desc: Test the read-only Ollama runtime metrics exporter
    cmds:
      - python3 -B -m unittest discover -s integrations/ollama/tests -v

  ollama-image-build:
    desc: Build the Ollama exporter locally (OLLAMA_PLATFORM=linux/amd64 or linux/arm64)
    cmds:
      - >-
        {{.RUNTIME}} build --platform '{{.OLLAMA_PLATFORM}}'
        --build-arg 'VERSION={{.OLLAMA_VERSION}}'
        --label 'org.opencontainers.image.revision={{.OLLAMA_REVISION}}'
        -f integrations/ollama/Containerfile -t '{{.OLLAMA_IMAGE}}' integrations/ollama

  ollama-patch-test:
    desc: Check sidecar installation and ConfigMap migration with local kubectl strategic merges
    cmds:
      - python3 -B integrations/ollama/tests/sidecar_patch.py -v

  ollama-image-test:
    desc: Check the built image's endpoints under the sidecar security restrictions
    env:
      CONTAINER_RUNTIME: '{{.RUNTIME}}'
      OLLAMA_IMAGE: '{{.OLLAMA_IMAGE}}'
      OLLAMA_PLATFORM: '{{.OLLAMA_PLATFORM}}'
      OLLAMA_VERSION: '{{.OLLAMA_VERSION}}'
    cmds:
      - python3 -B integrations/ollama/tests/container_smoke.py -v

  ollama-release-prepare:
    desc: Build/test both architectures and export a LOCAL release bundle (Podman; never publishes)
    env:
      OLLAMA_VERSION: '{{.OLLAMA_VERSION}}'
    cmds:
      - python3 -B integrations/ollama/prepare_release.py

  workflows-lint:
    desc: Check GitHub Actions workflows with actionlint
    cmds:
      - actionlint -color

  stackpack-sync-status:
    desc: List and describe every installed synchronization, including active errorDetails
    env:
      STS_CONTEXT: '{{.STS_CONTEXT}}'
    cmds:
      - bash scripts/stackpack-sync-status.sh

  stackpack-upload:
    desc: Validate/package, then upload once and install or upgrade SUSE AI
    cmds:
      - task: stackpack-validate
      - task: stackpack-package
      - bash scripts/run-setup.sh
    env:
      STS_CONTEXT: '{{.STS_CONTEXT}}'

  demo-deploy:
    desc: Validate and deploy a fresh 3.0.0-dev.N through an explicit demo port-forward; never restore
    requires:
      vars: [DEMO_URL, DEMO_TOKEN_FILE, DEMO_STATE_DIR]
    env:
      CONTAINER_RUNTIME: '{{.RUNTIME}}'
    cmds:
      - >-
        '{{.PYTHON}}' -B scripts/demo-deploy.py
        --url '{{.DEMO_URL}}' --token-file '{{.DEMO_TOKEN_FILE}}'
        --token-type '{{.DEMO_TOKEN_TYPE | default "service"}}'
        --state-dir '{{.DEMO_STATE_DIR}}' --cluster '{{.DEMO_CLUSTER | default "suse-ai"}}'
        --version '{{.DEMO_VERSION | default ""}}'
        --source '{{.DEMO_SOURCE | default "stackpack/suse-ai"}}'

  demo-ollama-deploy:
    desc: Import a tested branch-built exporter into every RKE2 demo node and roll out Ollama
    requires:
      vars: [DEMO_KUBECONFIG, DEMO_EVIDENCE, OLLAMA_IMAGE]
    cmds:
      - >-
        '{{.PYTHON}}' -B scripts/demo-ollama-deploy.py
        --kubeconfig '{{.DEMO_KUBECONFIG}}' --output '{{.DEMO_EVIDENCE}}'
        --runtime '{{.RUNTIME}}' --image '{{.OLLAMA_IMAGE}}'

  demo-monitor-test:
    desc: Preview threshold monitors in three states and capture derived-health dry runs; never persist test states
    requires:
      vars: [DEMO_URL, DEMO_TOKEN_FILE, DEMO_EVIDENCE, DEMO_MONITOR_BASELINE]
    cmds:
      - >-
        '{{.PYTHON}}' -B scripts/demo-monitor-check.py
        --url '{{.DEMO_URL}}' --token-file '{{.DEMO_TOKEN_FILE}}'
        --token-type '{{.DEMO_TOKEN_TYPE | default "service"}}'
        --monitors '{{.DEMO_MONITORS | default ""}}'
        --output '{{.DEMO_EVIDENCE}}' --baseline '{{.DEMO_MONITOR_BASELINE}}'

  stackpack-validate:
    desc: Validate native settings with the pinned server and reject an invalid CEL control
    env:
      CONTAINER_RUNTIME: '{{.RUNTIME}}'
    cmds:
      - bash scripts/ci/validate-native-stackpack.sh

  stackpack-uninstall:
    desc: Uninstall SUSE AI instances and wait for removal
    env:
      STS_CONTEXT: '{{.STS_CONTEXT}}'
      UNINSTALL: 'true'
    cmds:
      - bash scripts/run-setup.sh

  sts-script:
    desc: Runs a Groovy script from a file (use FILE=path/to/script.groovy)
    cmds:
      - sts script run --file "{{.FILE}}"

  component-model-build:
    desc: Stage an isolated Ollama spike (control or overlay); release sources stay unchanged
    requires:
      vars: [SPIKE_VERSION, SPIKE_OUTPUT, SPIKE_MODE]
    cmds:
      - >-
        '{{.PYTHON}}' -B experiments/component-model/build.py
        --version '{{.SPIKE_VERSION}}' --output '{{.SPIKE_OUTPUT}}'
        --mode '{{.SPIKE_MODE}}' {{.SPIKE_FLAGS | default ""}}

  component-model-validate:
    desc: Validate a staged component model spike with the pinned native validator
    requires:
      vars: [SPIKE_OUTPUT]
    env:
      CONTAINER_RUNTIME: '{{.RUNTIME}}'
      SPIKE_PACK: '{{.SPIKE_OUTPUT}}/suse-ai'
    cmds:
      - bash -c 'source scripts/ci/stackpack-images.env; bash scripts/ci/validate_stackpack.sh "$SPIKE_PACK"'

  component-model-package:
    desc: Package an already staged spike without uploading it
    requires:
      vars: [SPIKE_OUTPUT, SPIKE_VERSION]
    cmds:
      - sts stackpack package -d '{{.SPIKE_OUTPUT}}/suse-ai' -f '{{.SPIKE_OUTPUT}}/suse-ai-{{.SPIKE_VERSION}}.sts'

  component-model-test:
    desc: Exercise spike GPU identity and workload attribution against the actual CEL mappings
    cmds:
      - '{{.PYTHON}} -B experiments/component-model/test_spike.py -v'

  component-model-inspect:
    aliases: [demo-inspect]
    desc: Read-only snapshots through an explicit local demo port-forward; never uses a default context
    requires:
      vars: [SPIKE_URL, SPIKE_TOKEN_FILE, SPIKE_EVIDENCE, SPIKE_STAGE]
    cmds:
      - >-
        '{{.PYTHON}}' -B experiments/component-model/inspect.py
        --url '{{.SPIKE_URL}}' --token-file '{{.SPIKE_TOKEN_FILE}}'
        --token-type '{{.SPIKE_TOKEN_TYPE | default "service"}}'
        --output '{{.SPIKE_EVIDENCE}}' --stage '{{.SPIKE_STAGE}}'
