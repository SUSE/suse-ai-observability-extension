name: Validate StackPack IDs

on:
  pull_request:
    paths:
      - 'stackpack/**'
      - 'scripts/check-id-conflicts.py'
      - '.github/workflows/validate-ids.yml'
  push:
    branches:
      - main
    paths:
      - 'stackpack/**'
      - 'scripts/check-id-conflicts.py'
      - '.github/workflows/validate-ids.yml'
  workflow_dispatch:

jobs:
  check-id-conflicts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for duplicate StackPack IDs
        run: python3 scripts/check-id-conflicts.py stackpack
