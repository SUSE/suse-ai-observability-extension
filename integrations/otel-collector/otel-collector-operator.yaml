# -----------------------------------------------------------------------------
# SUSE AI Observability — OpenTelemetry Operator example
# -----------------------------------------------------------------------------
# Equivalent of integrations/otel-collector/otel-values.yaml, expressed as an
# OpenTelemetryCollector custom resource for the OpenTelemetry Operator
# (https://github.com/open-telemetry/opentelemetry-operator).
#
# Key differences from the Helm values file:
#   * There are no chart "presets" or default components. Everything the Helm
#     chart injected for free is written out here explicitly:
#       - the otlp / jaeger receivers,
#       - the health_check, memory_limiter and batch components,
#       - the explicit k8s_attributes processor used by the Helm configuration,
#       - the RBAC needed by k8s_attributes (ServiceAccount + ClusterRole +
#         ClusterRoleBinding below).
#   * `spec.config` is a structured object (v1beta1), not a YAML string.
#
# Prereqs: the OpenTelemetry Operator and cert-manager installed, and a Secret
# named `open-telemetry-collector` holding API_KEY (and any receiver creds).
#
# Placeholders to update before applying: cluster name, namespaces, endpoints,
# and the elasticsearch/opensearch credentials (do NOT hard-code them — pull
# them from the Secret via env, as shown).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suse-ai-otel-collector
  namespace: observability
imagePullSecrets:
  - name: application-collection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: suse-ai-otel-collector
rules:
  # Required by the k8s_attributes processor. "namespaces" backs namespace
  # labels; "replicasets" (apps + legacy extensions) lets it walk a pod's owner
  # chain to derive k8s.deployment.name. Endpoints/services back the Prometheus
  # kubernetes_sd_configs discovery below.
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Required so kube-rbac-proxy (KServe controller metrics on :8443) authorizes
  # the collector's scrape via SubjectAccessReview on the /metrics endpoint.
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: suse-ai-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: suse-ai-otel-collector
subjects:
  - kind: ServiceAccount
    name: suse-ai-otel-collector
    namespace: observability
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: suse-ai
  namespace: observability
spec:
  mode: deployment
  replicas: 1  # tail_sampling and the prometheus receiver are stateful; scaling
               # out requires a load_balancing front tier (not covered here).
  serviceAccount: suse-ai-otel-collector
  image: ghcr.io/suse/suse-ai-opentelemetry-collector:0.156.0
  env:
    - name: K8S_CLUSTER_NAME
      value: "local"  # Update to match your cluster name
    - name: SUSE_AI_NAMESPACE
      value: "suse-private-ai"  # Update to match the SUSE AI namespace
    - name: KUBEFLOW_NAMESPACE
      value: "kubeflow"  # Update to match the Kubeflow control-plane namespace
    - name: MODEL_REGISTRY_BEARER_TOKEN
      # The demo Kubeflow AuthorizationPolicy requires an Authorization header.
      # Override this value from a Secret for any non-demo environment.
      value: "demo"
    # Keep Go's runtime memory target at roughly 80% of the container limit, in
    # line with the memory_limiter hard threshold, so GC starts before an OOM.
    - name: GOMEMLIMIT
      value: "800MiB"
  envFrom:
    - secretRef:
        name: open-telemetry-collector  # must provide API_KEY (+ receiver creds)
  # Right-size the collector and make memory_limiter meaningful: its percentages
  # are shares of THIS limit, not the node's total memory. Tune to your volume.
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config:
    receivers:
      # Default OTLP endpoint is localhost — must be 0.0.0.0 to receive traffic
      # from other pods.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      elasticsearch:
        endpoint: "http://opensearch-cluster-master-headless.suse-private-ai.svc.cluster.local:9200"
        # Pull credentials from the Secret via env instead of hard-coding them.
        username: "${env:OPENSEARCH_USERNAME}"
        password: "${env:OPENSEARCH_PASSWORD}"
        tls:
          insecure_skip_verify: true  # set false + provide a CA in production
        collection_interval: 10s
        metrics:
          elasticsearch.node.fs.disk.total:
            enabled: true
          elasticsearch.node.fs.disk.available:
            enabled: true
      http_check/model-registry:
        collection_interval: 30s
        metrics:
          httpcheck.response.size:
            enabled: true
          httpcheck.validation.passed:
            enabled: true
          httpcheck.validation.failed:
            enabled: true
        targets:
          - endpoint: "http://model-registry-service.${env:KUBEFLOW_NAMESPACE}.svc.cluster.local:8080/api/model_registry/v1alpha3/registered_models"
            method: GET
            headers:
              Authorization: "Bearer ${env:MODEL_REGISTRY_BEARER_TOKEN}"
            validations:
              - contains: '"items"'
      prometheus:
        config:
          scrape_configs:
            - job_name: 'gpu-metrics'
              scrape_interval: 10s
              scrape_timeout: 5s
              scheme: http
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names:
                      - gpu-operator
              relabel_configs:
                # Scrape only the DCGM exporter's metrics port (adjust the regex
                # if your exporter names its port differently).
                - source_labels: [__meta_kubernetes_endpoint_port_name]
                  action: keep
                  regex: 'gpu-metrics|metrics'
              # Drop runtime/infra metric families the extension never binds.
              metric_relabel_configs: &drop_infra_metrics
                - source_labels: [__name__]
                  regex: '(go|process|promhttp|python)_.*'
                  action: drop
            - job_name: 'milvus'
              scrape_interval: 15s
              scrape_timeout: 10s
              metrics_path: '/metrics'
              static_configs:
                - targets: ['milvus.suse-private-ai.svc.cluster.local:9091']
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'qdrant'
              scrape_interval: 10s
              scrape_timeout: 5s
              metrics_path: '/metrics'
              static_configs:
                - targets: ['qdrant.suse-private-ai.svc.cluster.local:6333']
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'vllm'
              scrape_interval: 10s
              scrape_timeout: 5s
              scheme: http
              kubernetes_sd_configs:
                # endpoints (not service) so each vLLM replica is scraped directly.
                - role: endpoints
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: 'suse-private-ai'
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: '.*vllm.*'
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'kubeflow-pipelines'
              scrape_interval: 15s
              scrape_timeout: 10s
              metrics_path: '/metrics'
              kubernetes_sd_configs:
                - role: service
                  namespaces:
                    names:
                      - ${env:KUBEFLOW_NAMESPACE}
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: '(ml-pipeline|ml-pipeline-scheduledworkflow|ml-pipeline-persistenceagent|metadata-grpc-service)'
                # Only scrape the HTTP metrics port. The KFP api-server serves
                # Prometheus on its 'http' port (8888); its 'grpc' port (8887) and
                # the gRPC-only metadata-grpc-service return 415/503 on /metrics.
                - source_labels: [__meta_kubernetes_service_port_name]
                  action: keep
                  regex: '(http|metrics|http-metrics)'
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'kubeflow-workflow-controller'
              scrape_interval: 15s
              scrape_timeout: 10s
              metrics_path: '/metrics'
              # Argo Workflow Controller exposes metrics over HTTPS with a
              # cluster-local self-signed certificate. Pod discovery avoids the
              # deprecated workflow-controller-metrics Service.
              scheme: https
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - ${env:KUBEFLOW_NAMESPACE}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: 'workflow-controller'
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: '9090'
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'kserve-controller'
              scrape_interval: 15s
              scrape_timeout: 10s
              metrics_path: '/metrics'
              # The SUSE Kubeflow chart fronts the KServe controller metrics with
              # kube-rbac-proxy: HTTPS on port 8443, bearer-token auth.
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              # The control-plane label is specific enough to discover the
              # controller in either the Kubeflow or standalone KServe namespace.
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_control_plane]
                  action: keep
                  regex: 'kserve-controller-manager'
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: '8443'
              metric_relabel_configs: *drop_infra_metrics
            - job_name: 'kserve-inferenceservices'
              scrape_interval: 15s
              scrape_timeout: 10s
              metrics_path: '/metrics'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
                  action: keep
                  regex: '.+'
                # Anchor on the model container's serving port, then rewrite the
                # target from KServe's Prometheus annotations.
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: 'user-port'
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_kserve_io_port]
                  action: replace
                  regex: '([^:]+)(?::\d+)?;(\d+)'
                  replacement: '$$1:$$2'
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_kserve_io_path]
                  action: replace
                  regex: '(.+)'
                  target_label: __metrics_path__
              metric_relabel_configs: *drop_infra_metrics

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      # OOM safety valve — first in every pipeline. Pair with the GOMEMLIMIT env
      # var above.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}

      # Same explicit k8s_attributes config as the Helm values. Associates each
      # record to a pod (by IP, then pod.uid, then the originating connection)
      # and enriches it with pod/namespace/workload metadata.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          # extractAllPodLabels: true -> promote every pod label to a resource
          # attribute. Convenient but high-cardinality/costly; prefer an explicit
          # allowlist (drop the key_regex entry and list individual labels).
          labels:
            - tag_name: $$1
              key_regex: (.*)
              from: pod
          otel_annotations: true
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      resource/elasticsearch:
        attributes:
          - key: suse.ai.managed
            value: "true"
            action: insert
          - key: suse.ai.component.name
            value: "opensearch"
            action: insert
          - key: suse.ai.component.type
            value: "search-engine"
            action: insert
          - key: service.name
            value: "opensearch"
            action: insert
          - key: service.namespace
            value: ${env:SUSE_AI_NAMESPACE}
            action: insert
          - key: k8s.namespace.name
            value: ${env:SUSE_AI_NAMESPACE}
            action: upsert
          - key: service.instance.id
            value: "opensearch-cluster"
            action: insert

      resource/kubeflow-model-registry:
        attributes:
          - key: service.name
            value: model-registry-service
            action: upsert
          - key: service.instance.id
            value: kubeflow-model-registry
            action: upsert
          - key: service.namespace
            value: ${env:KUBEFLOW_NAMESPACE}
            action: upsert
          - key: k8s.namespace.name
            value: ${env:KUBEFLOW_NAMESPACE}
            action: upsert
          - key: suse.ai.managed
            value: "true"
            action: upsert
          - key: suse.ai.component.name
            value: kubeflow-model-registry
            action: upsert
          - key: suse.ai.component.type
            value: ml-registry
            action: upsert

      transform/vllm:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "vllm"
              - set(attributes["suse.ai.component.name"], "vllm") where attributes["service.name"] == "vllm"
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["service.name"] == "vllm"
              - set(attributes["service.instance.id"], "vllm") where attributes["service.name"] == "vllm"
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.name"] == "vllm" and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "vllm" and attributes["service.namespace"] == nil
      transform/qdrant:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "qdrant"
              - set(attributes["suse.ai.component.name"], "qdrant") where attributes["service.name"] == "qdrant"
              - set(attributes["suse.ai.component.type"], "vectordb") where attributes["service.name"] == "qdrant"
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.name"] == "qdrant" and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "qdrant" and attributes["service.namespace"] == nil
      transform/milvus:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "milvus"
              - set(attributes["suse.ai.component.name"], "milvus") where attributes["service.name"] == "milvus"
              - set(attributes["suse.ai.component.type"], "vectordb") where attributes["service.name"] == "milvus"
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.name"] == "milvus" and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "milvus" and attributes["service.namespace"] == nil

      transform/kserve:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kserve-inferenceservices|kserve-controller)$")
              - set(attributes["suse.ai.component.name"], "kserve") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kserve-inferenceservices|kserve-controller)$")
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kserve-inferenceservices|kserve-controller)$")
              - set(attributes["service.instance.id"], attributes["service.name"]) where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kserve-inferenceservices|kserve-controller)$") and attributes["service.instance.id"] == nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kserve-inferenceservices|kserve-controller)$") and attributes["k8s.namespace.name"] == nil
      transform/kubeflow-pipelines:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kubeflow-pipelines|kubeflow-workflow-controller)$")
              - set(attributes["suse.ai.component.name"], "kubeflow-pipelines") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kubeflow-pipelines|kubeflow-workflow-controller)$")
              - set(attributes["suse.ai.component.type"], "workflow-engine") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kubeflow-pipelines|kubeflow-workflow-controller)$")
              - set(attributes["service.instance.id"], attributes["service.name"]) where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kubeflow-pipelines|kubeflow-workflow-controller)$") and attributes["service.instance.id"] == nil
              - set(attributes["k8s.namespace.name"], "${env:KUBEFLOW_NAMESPACE}") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "^(kubeflow-pipelines|kubeflow-workflow-controller)$") and attributes["k8s.namespace.name"] == nil
      transform/kubeflow-model-registry:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "model-registry-service"
              - set(attributes["suse.ai.component.name"], "kubeflow-model-registry") where attributes["service.name"] == "model-registry-service"
              - set(attributes["suse.ai.component.type"], "ml-registry") where attributes["service.name"] == "model-registry-service"
              - set(attributes["service.instance.id"], "kubeflow-model-registry") where attributes["service.name"] == "model-registry-service" and attributes["service.instance.id"] == nil
              - set(attributes["k8s.namespace.name"], "${env:KUBEFLOW_NAMESPACE}") where attributes["service.name"] == "model-registry-service" and attributes["k8s.namespace.name"] == nil

      tail_sampling:
        decision_wait: 10s
        # Bound the in-memory trace buffer for predictable memory use.
        num_traces: 5000
        expected_new_traces_per_sec: 200
        policies:
          - name: rate-limited-composite
            type: composite
            composite:
              max_total_spans_per_second: 500
              policy_order: [errors, slow-traces, rest]
              composite_sub_policy:
                - name: errors
                  type: status_code
                  status_code:
                    status_codes: [ ERROR ]
                - name: slow-traces
                  type: latency
                  latency:
                    threshold_ms: 1000
                - name: rest
                  type: always_sample
              rate_allocation:
                - policy: errors
                  percent: 33
                - policy: slow-traces
                  percent: 33
                - policy: rest
                  percent: 34

      resource:
        attributes:
          - key: k8s.cluster.name
            action: insert
            value: ${env:K8S_CLUSTER_NAME}
          - key: service.instance.id
            from_attribute: k8s.pod.uid
            action: insert

      filter/genai-metrics-only:
        error_mode: ignore
        metrics:
          metric:
            - not(IsMatch(name, "gen_ai\\..*"))
      groupbyattrs/infer-providers:
        keys:
          - gen_ai.provider.name
      transform/infer-providers:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] == nil
      groupbyattrs/infer-models:
        keys:
          - gen_ai.request.model
          - gen_ai.provider.name
      transform/infer-models:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"] != nil
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] == nil
      filter/exclude-already-tagged:
        error_mode: ignore
        metrics:
          resource:
            - attributes["suse.ai.component.name"] != nil
      transform/infer-applications:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true")
              - set(attributes["suse.ai.component.type"], "application")
              - set(attributes["suse.ai.component.name"], attributes["service.name"])
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.namespace"] == nil

      filter/genai-spans:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.request.model"] == nil
      groupbyattrs/model-relations:
        keys:
          - gen_ai.provider.name
      transform/model-relations:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
          - context: span
            statements:
              - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
      transform/provider-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil

      transform/kserve-traces:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["serving.kserve.io/inferenceservice"] != nil or attributes["service.name"] != nil and IsMatch(attributes["service.name"], ".*-predictor-default|.*-transformer-default|.*-explainer-default")
              - set(attributes["suse.ai.component.name"], "kserve") where attributes["serving.kserve.io/inferenceservice"] != nil or attributes["service.name"] != nil and IsMatch(attributes["service.name"], ".*-predictor-default|.*-transformer-default|.*-explainer-default")
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["serving.kserve.io/inferenceservice"] != nil or attributes["service.name"] != nil and IsMatch(attributes["service.name"], ".*-predictor-default|.*-transformer-default|.*-explainer-default")
      transform/kfp-traces:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "ml-pipeline|ml-pipeline-scheduledworkflow|ml-pipeline-persistenceagent|metadata-grpc-service")
              - set(attributes["suse.ai.component.name"], "kubeflow-pipelines") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "ml-pipeline|ml-pipeline-scheduledworkflow|ml-pipeline-persistenceagent|metadata-grpc-service")
              - set(attributes["suse.ai.component.type"], "workflow-engine") where attributes["service.name"] != nil and IsMatch(attributes["service.name"], "ml-pipeline|ml-pipeline-scheduledworkflow|ml-pipeline-persistenceagent|metadata-grpc-service")
      transform/kubeflow-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], "kserve") where attributes["kserve.inference.service"] != nil
              - set(attributes["peer.service"], "kubeflow-model-registry") where attributes["url.full"] != nil and IsMatch(attributes["url.full"], ".*model-registry.*")
              - set(attributes["peer.service"], "kubeflow-model-registry") where attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*model-registry.*")
      # Translate Kubeflow dependency spans only inside the topology pipeline;
      # normal traces retain their original semantic attributes.
      transform/kubeflow-product-topology:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["gen_ai.provider.name"], "kserve") where attributes["kserve.inference.service"] != nil and attributes["gen_ai.provider.name"] == nil
              - set(attributes["gen_ai.provider.name"], "kubeflow-model-registry") where attributes["url.full"] != nil and IsMatch(attributes["url.full"], ".*model-registry.*") and attributes["gen_ai.provider.name"] == nil
              - set(attributes["gen_ai.provider.name"], "kubeflow-model-registry") where attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*model-registry.*") and attributes["gen_ai.provider.name"] == nil

      filter/dropMissingK8sAttributes:
        error_mode: ignore
        traces:
          span:
            # Drop only spans that cannot be placed in the topology at all.
            # Spans merely missing node.name/pod.uid are kept.
            - resource.attributes["k8s.namespace.name"] == nil
            - resource.attributes["k8s.pod.name"] == nil

    connectors:
      spanmetrics:
        metrics_expiration: 5m
        namespace: otel_span
      # Fan the trace stream into the sub-pipelines below.
      forward: {}

    exporters:
      debug: {}  # defined for ad-hoc troubleshooting; intentionally not wired
                 # into any pipeline below.
      topology:
        endpoint: http://suse-observability-router.suse-observability.svc.cluster.local:8080
        api_key: ${env:API_KEY}
        namespace: ${env:SUSE_AI_NAMESPACE}
        # Cluster identity is a label only; the pinned image supports cluster_name.
        cluster_name: ${env:K8S_CLUSTER_NAME}
        tls:
          insecure_skip_verify: true  # set false + provide a CA in production
      otlp:
        endpoint: http://suse-observability-otel-collector.suse-observability.svc.cluster.local:4317
        headers:
          Authorization: "SUSEObservability ${env:API_KEY}"
        tls:
          insecure: true  # set false + provide a CA in production
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
          # For durability across restarts, add a file_storage extension backed
          # by a mounted volume and set: storage: file_storage

    service:
      extensions:
        - health_check
      # Collector self-telemetry (parity with the Helm chart's metrics port).
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # k8s_attributes runs on the ingress pipelines (right after
        # memory_limiter). The forward-fed trace sub-pipelines inherit the
        # enrichment done here, so they don't repeat it.
        traces:
          receivers: [otlp, jaeger]
          processors: [memory_limiter, k8s_attributes, filter/dropMissingK8sAttributes, resource]
          exporters: [forward]
        traces/spanmetrics:
          receivers: [forward]
          processors: [memory_limiter]
          exporters: [spanmetrics]
        traces/sampling:
          receivers: [forward]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp]
        traces/model-relations:
          receivers: [forward]
          processors: [memory_limiter, filter/genai-spans, groupbyattrs/model-relations, transform/model-relations, batch]
          exporters: [otlp]
        traces/provider-relations:
          receivers: [forward]
          processors: [memory_limiter, filter/genai-spans, transform/provider-relations, batch]
          exporters: [otlp]
        traces/topology:
          receivers: [forward]
          processors: [memory_limiter, transform/kubeflow-product-topology, batch]
          exporters: [topology]
        # Tag KServe and Kubeflow Pipelines spans, then surface product
        # dependencies through peer.service.
        traces/kubeflow-relations:
          receivers: [forward]
          processors: [memory_limiter, transform/kserve-traces, transform/kfp-traces, transform/kubeflow-relations, batch]
          exporters: [otlp]

        metrics:
          receivers: [otlp, spanmetrics, prometheus]
          processors: [memory_limiter, k8s_attributes, transform/qdrant, transform/milvus, transform/vllm, transform/kserve, transform/kubeflow-pipelines, transform/kubeflow-model-registry, resource, batch]
          exporters: [otlp]
        # The Model Registry exposes no Prometheus endpoint. Synthetic API
        # checks provide availability, latency, and body-validation signals.
        metrics/kubeflow-model-registry:
          receivers: [http_check/model-registry]
          processors: [memory_limiter, resource/kubeflow-model-registry, resource, batch]
          exporters: [otlp]
        metrics/infer-providers:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, groupbyattrs/infer-providers, transform/infer-providers, resource, batch]
          exporters: [otlp]
        metrics/infer-models:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, groupbyattrs/infer-models, transform/infer-models, resource, batch]
          exporters: [otlp]
        metrics/infer-applications:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, filter/exclude-already-tagged, transform/infer-applications, resource, batch]
          exporters: [otlp]
        metrics/elasticsearch:
          receivers: [elasticsearch]
          processors: [memory_limiter, resource/elasticsearch, resource, batch]
          exporters: [otlp]
