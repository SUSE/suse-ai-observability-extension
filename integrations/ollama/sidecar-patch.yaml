# Strategic merge patch for an existing Ollama Deployment, not a new workload.
# Create the ollama-runtime-metrics ConfigMap from ollama_metrics.py first.
spec:
  template:
    spec:
      containers:
        - name: ollama-runtime-metrics
          image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python3, -B, /opt/ollama-metrics/ollama_metrics.py]
          ports:
            - name: ollama-metrics
              containerPort: 11435
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: ollama-metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: ollama-metrics}
          volumeMounts:
            - name: ollama-runtime-metrics
              mountPath: /opt/ollama-metrics
              readOnly: true
      volumes:
        - name: ollama-runtime-metrics
          configMap:
            name: ollama-runtime-metrics
